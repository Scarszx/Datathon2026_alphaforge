[project]
name = "alphaforge-backend"
version = "0.1.0"
description = "AlphaForge — assistant agentique auto-explicatif d'aide à la décision d'investissement (simulation seulement). Datathon 2026."
requires-python = ">=3.12"
dependencies = [
    "python-ulid>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# Les tests importent backend.common.* : racine du projet dans le chemin.
pythonpath = ["."]
testpaths = ["backend/common/tests"]
