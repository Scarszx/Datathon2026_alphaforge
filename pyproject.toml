[project]
name = "alphaforge-backend"
version = "0.1.0"
description = "AlphaForge — assistant agentique auto-explicatif d'aide à la décision d'investissement (simulation seulement). Datathon 2026."
requires-python = ">=3.12"
dependencies = [
    "python-ulid>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# Les tests importent backend.common.* : racine du projet dans le chemin.
pythonpath = ["."]
# backend/api/tests se lance à part : test_universe vérifie que pyarrow n'est pas importé
# dans le processus, ce que les tests de backend/agents (pandas) rendent faux.
testpaths = ["backend/common/tests", "backend/agents/tests"]
# pandas (resample) émet un avertissement interne de NumPy : sans effet sur nos calculs.
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
